services:
  - type: web
    name: smart-healthcare-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        value: https://smart-healthcare-phi.vercel.app,http://localhost:3000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
